<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mason Jar Tracker</title>
  <style>
    :root {
      --bg: #f8fafc;
      --card: #ffffff;
      --primary: #2563eb;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --lent: #ef4444;
      --stock: #10b981;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 16px; max-width: 500px; margin: 0 auto; }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    h1 { font-size: 1.25rem; font-weight: 700; }
    .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 16px; }
    .stat-card { background: var(--card); border: 1px solid var(--border); padding: 12px; border-radius: 8px; text-align: center; }
    .stat-val { font-size: 1.4rem; font-weight: 700; }
    .stat-lbl { font-size: 0.75rem; color: var(--muted); text-transform: uppercase; }
    .search-box { width: 100%; padding: 10px 14px; border: 1px solid var(--border); border-radius: 8px; margin-bottom: 12px; font-size: 1rem; }
    .btn { background: var(--primary); color: white; border: none; padding: 10px 14px; border-radius: 8px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
    .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); }
    .jar-list { display: flex; flex-direction: column; gap: 10px; }
    .jar-card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 14px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
    .jar-id { font-weight: 700; font-size: 1rem; }
    .jar-meta { font-size: 0.85rem; color: var(--muted); margin-top: 2px; }
    .badge { font-size: 0.75rem; padding: 4px 8px; border-radius: 999px; font-weight: 600; text-transform: uppercase; }
    .badge-lent { background: #fee2e2; color: var(--lent); }
    .badge-stock { background: #d1fae5; color: var(--stock); }
    
    /* Modal */
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); align-items: center; justify-content: center; padding: 16px; z-index: 50; }
    .modal-overlay.active { display: flex; }
    .modal { background: var(--card); width: 100%; max-width: 400px; border-radius: 12px; padding: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
    .modal h2 { font-size: 1.2rem; margin-bottom: 12px; }
    .field { margin-bottom: 12px; }
    .field label { display: block; font-size: 0.8rem; font-weight: 600; color: var(--muted); margin-bottom: 4px; }
    .field input, .field select { width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 0.95rem; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
  </style>
</head>
<body>

  <header>
    <h1>🫙 Mason Jar Tracker</h1>
    <button class="btn btn-outline" onclick="openNewJarModal()">+ New Jar</button>
  </header>

  <div class="stats">
    <div class="stat-card">
      <div class="stat-val" id="count-lent" style="color: var(--lent);">0</div>
      <div class="stat-lbl">Lent Out</div>
    </div>
    <div class="stat-card">
      <div class="stat-val" id="count-stock" style="color: var(--stock);">0</div>
      <div class="stat-lbl">In Stock</div>
    </div>
  </div>

  <input type="text" id="search" class="search-box" placeholder="Search jar, borrower, or contents..." oninput="renderList()" />

  <div class="jar-list" id="jarList"></div>

  <div class="modal-overlay" id="jarModal">
    <div class="modal">
      <h2 id="modalJarTitle">Edit Jar</h2>
      <div class="field">
        <label>Status</label>
        <select id="modalStatus" onchange="toggleHolderRequired()">
          <option value="In Stock">In Stock (Available)</option>
          <option value="Lent Out">Lent Out</option>
        </select>
      </div>
      <div class="field">
        <label>Lent To (Borrower Name)</label>
        <input type="text" id="modalHolder" placeholder="e.g. Miller Family" />
      </div>
      <div class="field">
        <label>Date Lent</label>
        <input type="date" id="modalDate" />
      </div>
      <div class="field">
        <label>Contents / Notes</label>
        <input type="text" id="modalNotes" placeholder="e.g. Peach Jam, Sourdough" />
      </div>
      <div class="modal-actions">
        <button class="btn btn-outline" onclick="closeModal()">Cancel</button>
        <button class="btn" onclick="saveJarChanges()">Save Changes</button>
      </div>
    </div>
  </div>

  <script>
    const DEFAULT_JARS = [
      { id: "JAR-01", size: "32oz Wide Mouth", status: "In Stock", holder: "", date: "", notes: "" },
      { id: "JAR-02", size: "32oz Wide Mouth", status: "In Stock", holder: "", date: "", notes: "" },
      { id: "JAR-03", size: "16oz Regular", status: "In Stock", holder: "", date: "", notes: "" },
      { id: "JAR-04", size: "64oz Half Gallon", status: "In Stock", holder: "", date: "", notes: "" }
    ];

    let jars = JSON.parse(localStorage.getItem("mason_jars")) || DEFAULT_JARS;
    let activeJarId = null;

    function saveToStorage() {
      localStorage.setItem("mason_jars", JSON.stringify(jars));
    }

    function renderList() {
      const query = document.getElementById("search").value.toLowerCase();
      const listEl = document.getElementById("jarList");
      listEl.innerHTML = "";

      let lentCount = 0;
      let stockCount = 0;

      jars.forEach(jar => {
        if (jar.status === "Lent Out") lentCount++;
        else stockCount++;

        const match = jar.id.toLowerCase().includes(query) ||
                      (jar.holder && jar.holder.toLowerCase().includes(query)) ||
                      (jar.notes && jar.notes.toLowerCase().includes(query));

        if (!match) return;

        const card = document.createElement("div");
        card.className = "jar-card";
        card.onclick = () => openJarModal(jar.id);
        card.innerHTML = `
          <div>
            <div class="jar-id">${jar.id} <span style="font-size: 0.8rem; font-weight: normal; color: var(--muted);">(${jar.size})</span></div>
            <div class="jar-meta">
              ${jar.status === "Lent Out" ? `With: <b>${jar.holder}</b> (${jar.date || 'No date'})` : 'Available on shelf'}
              ${jar.notes ? `• <i>${jar.notes}</i>` : ''}
            </div>
          </div>
          <span class="badge ${jar.status === "Lent Out" ? 'badge-lent' : 'badge-stock'}">${jar.status}</span>
        `;
        listEl.appendChild(card);
      });

      document.getElementById("count-lent").innerText = lentCount;
      document.getElementById("count-stock").innerText = stockCount;
    }

    function openJarModal(id) {
      activeJarId = id;
      const jar = jars.find(j => j.id === id);
      if (!jar) return;

      document.getElementById("modalJarTitle").innerText = `${jar.id} (${jar.size})`;
      document.getElementById("modalStatus").value = jar.status;
      document.getElementById("modalHolder").value = jar.holder || "";
      document.getElementById("modalDate").value = jar.date || new Date().toISOString().split('T')[0];
      document.getElementById("modalNotes").value = jar.notes || "";

      document.getElementById("jarModal").classList.add("active");
    }

    function closeModal() {
      document.getElementById("jarModal").classList.remove("active");
      activeJarId = null;
    }

    function saveJarChanges() {
      const jar = jars.find(j => j.id === activeJarId);
      if (jar) {
        jar.status = document.getElementById("modalStatus").value;
        jar.holder = jar.status === "In Stock" ? "" : document.getElementById("modalHolder").value;
        jar.date = jar.status === "In Stock" ? "" : document.getElementById("modalDate").value;
        jar.notes = document.getElementById("modalNotes").value;
        saveToStorage();
        renderList();
      }
      closeModal();
    }

    function openNewJarModal() {
      const newId = prompt("Enter new Jar ID (e.g., JAR-05):");
      if (!newId) return;
      const size = prompt("Enter Jar Size (e.g., 32oz Wide Mouth):", "32oz Wide Mouth") || "Standard";
      jars.push({ id: newId.trim().toUpperCase(), size: size.trim(), status: "In Stock", holder: "", date: "", notes: "" });
      saveToStorage();
      renderList();
    }

    // Auto-open if launched via NFC URL: ?jar=JAR-01
    window.addEventListener("DOMContentLoaded", () => {
      renderList();
      const params = new URLSearchParams(window.location.search);
      const scannedId = params.get("jar");
      if (scannedId) {
        const found = jars.find(j => j.id.toLowerCase() === scannedId.toLowerCase());
        if (found) {
          openJarModal(found.id);
        } else {
          // If scanned a new jar not in list, prompt to create
          if (confirm(`Jar ${scannedId} not found. Create it now?`)) {
            jars.push({ id: scannedId.toUpperCase(), size: "32oz Wide Mouth", status: "In Stock", holder: "", date: "", notes: "" });
            saveToStorage();
            renderList();
            openJarModal(scannedId.toUpperCase());
          }
        }
      }
    });
  </script>
</body>
</html>
